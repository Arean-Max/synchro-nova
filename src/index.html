<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: asset: asset://localhost http://asset.localhost https://asset.localhost; font-src 'self'; connect-src 'self' ipc: http://ipc.localhost https://ipc.localhost; object-src 'none'; base-uri 'none'; frame-ancestors 'none'; form-action 'none'"
    />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="dark" />
    <title>Synchro Nova</title>
    <link rel="preload" as="image" href="./assets/synchro-nova-icon.png" type="image/png" />
    <link rel="stylesheet" href="./styles.css" />
    <script type="module" src="./app/main.js"></script>
  </head>
  <body>
    <div id="intro-splash-screen" class="intro-splash-screen splash-animate">
      <div class="intro-splash-backdrop"></div>
      <div class="intro-splash-stage">
        <div class="intro-splash-logo-wrap">
          <img class="intro-splash-logo-img" src="./assets/synchro-nova-icon.png" alt="Synchro Nova" decoding="sync" loading="eager" />
        </div>
        <div class="intro-splash-title">
          <span class="splash-word-synchro"><span class="splash-char" style="--char-idx: 0">S</span><span class="splash-char" style="--char-idx: 1">y</span><span class="splash-char" style="--char-idx: 2">n</span><span class="splash-char" style="--char-idx: 3">c</span><span class="splash-char" style="--char-idx: 4">h</span><span class="splash-char" style="--char-idx: 5">r</span><span class="splash-char" style="--char-idx: 6">o</span></span>
          <span class="splash-space">&nbsp;</span>
          <span class="splash-word-nova"><span class="splash-char" style="--char-idx: 7">N</span><span class="splash-char" style="--char-idx: 8">o</span><span class="splash-char" style="--char-idx: 9">v</span><span class="splash-char" style="--char-idx: 10">a</span></span>
        </div>
      </div>
      <div class="intro-splash-check-text" id="splash-check-text">Checking for updates...</div>
      <div class="intro-splash-updater-card" id="splash-updater-card" style="display: none;">
        <div class="splash-card-track" id="splash-updater-track">
          <div class="splash-card-fill" id="splash-updater-fill" style="width: 0%"></div>
        </div>
        <div class="splash-card-row">
          <span class="splash-card-title" id="splash-updater-status">Downloading update...</span>
          <span class="splash-card-pct" id="splash-updater-pct">0%</span>
        </div>
        <div class="splash-card-actions">
          <button class="splash-btn splash-btn-manual" id="splash-btn-manual" type="button">
            <svg class="splash-btn-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/>
              <polyline points="7 10 12 15 17 10"/>
              <line x1="12" y1="15" x2="12" y2="3"/>
            </svg>
            <span id="splash-btn-manual-label">Manual Download</span>
          </button>
          <button class="splash-btn splash-btn-skip" id="splash-btn-skip" type="button">
            <span id="splash-btn-skip-label">Skip</span>
          </button>
        </div>
      </div>
      <div class="intro-splash-skip-hint" id="splash-skip-hint">Press Esc or click to skip</div>
    </div>
    <div id="app" class="app-shell"></div>
  </body>
</html>
