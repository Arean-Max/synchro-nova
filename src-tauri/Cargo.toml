[package]
name = "synchro"
version = "0.1.0"
description = "Synchro System & Performance"
authors = ["Synchro"]
license = ""
repository = ""
edition = "2021"
rust-version = "1.77.2"

[lib]
name = "synchro_lib"
crate-type = ["rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon", "protocol-asset"] }
getrandom = "0.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
winreg = "0.55.0"
time = "=0.3.36"

[profile.dev]
debug = false
debug-assertions = false
incremental = false
overflow-checks = true
panic = "abort"
strip = false

[profile.dev.build-override]
debug = false
debug-assertions = false
strip = false

[profile.release]
codegen-units = 1
debug = false
incremental = false
lto = true
opt-level = "z"
overflow-checks = true
panic = "abort"
strip = true

[profile.release.build-override]
debug = false
opt-level = 0
strip = false
