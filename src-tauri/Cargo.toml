[package]
name = "synchro"
version = "2.5.0-beta"
description = "Windows display calibration and system performance optimization utility"
authors = ["Arean-Max", "sotoykor-source <sotoykor@gmail.com>"]
license = "MIT"
repository = "https://github.com/Arean-Max/synchro-nova"
homepage = "https://github.com/Arean-Max/synchro-nova"
edition = "2021"
rust-version = "1.77.2"

[lib]
name = "synchro_lib"
crate-type = ["rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon", "protocol-asset"] }
getrandom = "0.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
winreg = "0.55.0"
time = "0.3"
sha2 = "0.10"
bincode = "1.3"

[target.'cfg(target_os = "windows")'.dependencies]
webview2-com-sys = { path = "crates/webview2-com-sys" }
windows-core = "0.61"

[profile.dev]
debug = false
incremental = false

[profile.dev.build-override]
debug = false
strip = false

[profile.release]
codegen-units = 1
debug = false
incremental = false
lto = "fat"
opt-level = "z"
overflow-checks = true
panic = "abort"
strip = true

[profile.release.build-override]
debug = false
opt-level = 0
strip = false

[patch.crates-io]
webview2-com-sys = { path = "crates/webview2-com-sys" }
