name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build & Release (Windows x64)
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        run: npm ci || npm install

      - name: Run test suite
        run: cargo test --manifest-path src-tauri/Cargo.toml

      - name: Build portable binary and installer
        run: |
          npm run build
          npm run build:portable

      - name: Compute SHA-256 checksums
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist-artifacts
          Copy-Item src-tauri/target/release/synchro.exe dist-artifacts/synchro.exe
          if (Test-Path src-tauri/target/release/bundle/nsis/*.exe) {
            Copy-Item src-tauri/target/release/bundle/nsis/*.exe dist-artifacts/
          }
          Get-ChildItem -Path dist-artifacts -Filter *.exe | ForEach-Object {
            $hash = (Get-FileHash -Path $_.FullName -Algorithm SHA256).Hash.ToLower()
            "$hash  $($_.Name)" | Out-File -Append -Encoding ascii dist-artifacts/SHA256SUMS.txt
          }
          Get-Content dist-artifacts/SHA256SUMS.txt

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: |
            dist-artifacts/*
          draft: false
          prerelease: false
          generate_release_notes: true
